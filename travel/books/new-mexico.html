.google.com/maps/dir/?api=1&destination=Best+Western+Airport+Albuquerque+InnSuites,+2400+Yale+Blvd+SE\" target=\"_blank\" rel=\"noopener\">Navigate to hotel ↗<\/a><\/div>\n<div class=\"cut\"><b>Before picking dates:<\/b> skip Thanksgiving and Christmas weekends, when most of these stops close. Mid-May to mid-October means the Bandelier shuttle; November to April means possible snow on NM-4 and at the Valles Caldera gate. Book 2 hotels: the Airport InnSuites for nights 1 and 3, Santa Fe for night 2. America the Beautiful + Access Pass cover entrance fees.<\/div>"},{"n":1,"dow":"Fri","dowLong":"Friday","kicker":"Day 1 · Friday · date TBD","title":"Caldera to cliff dwellings","sub":"Albuquerque → Valles Caldera → Los Alamos → Bandelier → Santa Fe","color":"#C1563A","drive":"~4h 20m","stamps":3,"start":"abqh","end":"sf","tzline":"Mountain time","cutLabel":"Good to know","cut":"Jemez Springs is the last easy stop for gas. Check Valles Caldera alerts the night before, and keep Day 1 on a Friday: the Manhattan Project desk is open Friday to Monday only.","gmaps":"https://www.google.com/maps/dir/Best+Western+Airport+Albuquerque+InnSuites/Valles+Caldera+Volcano+Discovery+Center/475+20th+St%2C+Los+Alamos%2C+NM/Bandelier+National+Monument+Visitor+Center/Best+Western+Plus+Inn+of+Santa+Fe"},{"n":2,"dow":"Sat","dowLong":"Saturday","kicker":"Day 2 · Saturday · date TBD","title":"Pecos and the Salt Missions","sub":"Santa Fe → Pecos → Moriarty → Quarai → Mountainair → Abó → Albuquerque","color":"#2FA3A0","drive":"~4h 10m","stamps":2,"start":"sf","end":"abqh2","tzline":"Mountain time","cutLabel":"Good to know","cut":"Salinas hours are 9 AM – 4 PM Nov–Mar and 10 AM – 5 PM Apr–Oct, so in winter keep moving after lunch to reach Abó well before 4.","gmaps":"https://www.google.com/maps/dir/Best+Western+Plus+Inn+of+Santa+Fe/Pecos+National+Historical+Park+Visitor+Center/Moriarty%2C+NM/Quarai%2C+Salinas+Pueblo+Missions+National+Monument/105+S+Ripley+Ave%2C+Mountainair%2C+NM/Abo%2C+Salinas+Pueblo+Missions+National+Monument/Best+Western+Airport+Albuquerque+InnSuites"},{"n":3,"dow":"Sun","dowLong":"Sunday","kicker":"Day 3 · Sunday · date TBD","title":"Inscriptions, lava, petroglyphs","sub":"Albuquerque → El Morro → El Malpais → Petroglyph → Old Town → home","color":"#D9A441","drive":"~4h 40m","stamps":3,"start":"abqh2","end":"abq","tzline":"Mountain time","cutLabel":"Good to know","cut":"Check out with luggage. Day 3 is the trip’s only backtrack: El Morro is a dead end off NM-53. Gas up in Grants; stations are sparse west of it. Petroglyph’s stamp desk closes at 4:30.","gmaps":"https://www.google.com/maps/dir/Best+Western+Airport+Albuquerque+InnSuites/El+Morro+National+Monument+Visitor+Center/El+Malpais+National+Monument+Visitor+Center%2C+Grants/Petroglyph+National+Monument+Visitor+Center/Boca+Negra+Canyon/Old+Town+Albuquerque/Albuquerque+Rental+Car+Center"}],"stops":[{"d":1,"kind":"stop","k":"vaca","color":"#C1563A","ink":"#FFFFFF","boxColor":"#C1563A","from":"Albuquerque","leave":"7:00 AM","drive":"~2h 5m","arrive":"9:05 AM","z":"MT","via":"I-25 → US-550 → NM-4, the Jemez Mountain Trail. Red cliffs at Jemez Pueblo, then the Soda Dam roadside pullout.","name":"Valles Caldera NPres","type":"National Preserve","place":"Volcano Discovery Center, Cabin District","addr":"Valles Caldera Volcano Discovery Center","where":"Volcano Discovery Center, 4 miles down the entrance road","hrs":"Vehicle gate 9 AM – 5 PM most of the year (8 AM – 6 PM Memorial Day to Labor Day). Closed Thanksgiving and Christmas.","warn":"In winter, snow can close or delay the gate. Check park alerts the night before.","ok":"Drive-up views of the Valle Grande. The eruption show runs every hour on the half hour.","about":"A volcanic caldera about 13 miles across, left by a huge eruption some 1.25 million years ago. Its grassy valles are home to a big elk herd."},{"d":1,"kind":"stop","k":"mapr","color":"#C1563A","ink":"#FFFFFF","boxColor":"#C1563A","from":"Valles Caldera","drive":"~40m","arrive":"10:55 AM","z":"MT","via":"Leave about 10:15. NM-4 → NM-501 into Los Alamos.","name":"Manhattan Project NHP","type":"National Historical Park","place":"Los Alamos Visitor Center","addr":"475 20th St, Los Alamos, NM 87544","where":"Visitor Center, 475 20th St","hrs":"Friday–Monday 10 AM – 3 PM; closed Tuesday–Thursday. NPS.gov doesn’t post these hours, so call ahead.","warn":"If the NPS desk is closed, stamps are kept at the Los Alamos County Visitor Center in the same building. Call (505) 661-6277 the week before.","ok":"Includes one-third of the three-part Los Alamos / Oak Ridge / Hanford stamp. Lunch in Los Alamos, 11:30 – 12:20.","about":"The secret wartime laboratory where the first atomic bombs were designed. The park is shared with Oak Ridge, Tennessee, and Hanford, Washington."},{"d":1,"kind":"stop","k":"band","color":"#C1563A","ink":"#FFFFFF","boxColor":"#C1563A","from":"Los Alamos","drive":"~30m","arrive":"1:00 PM","z":"MT","via":"Leave about 12:30. NM-501 → NM-4.","name":"Bandelier NM","type":"National Monument","place":"Frijoles Canyon Visitor Center","addr":"Bandelier National Monument Visitor Center","where":"Frijoles Canyon Visitor Center","hrs":"Daily 9 AM – 5 PM. Closed Christmas.","warn":"Mid-May to mid-October, cars arriving 9 AM – 3 PM must park at the White Rock Visitor Center and ride the shuttle in. Off-season, drive straight to the canyon.","acc":"The first stretch of the Main Loop Trail passes the Big Kiva and Tyuonyi village. The cliff dwellings need ladders, so enjoy them from below.","about":"Ancestral Pueblo people carved homes into the soft volcanic tuff of Frijoles Canyon and farmed the mesas here for about 400 years."},{"d":1,"kind":"night","k":"sf","from":"Bandelier","drive":"~1h 10m","arrive":"4:10 PM","z":"MT","via":"Leave about 3:00. NM-4 → NM-502 → US-84/285.","name":"Santa Fe, NM","addr":"Best Western Plus Inn of Santa Fe, 3650 Cerrillos Rd, Santa Fe, NM","note":"Best Western Plus Inn of Santa Fe, 3650 Cerrillos Rd. Dinner around the Santa Fe Plaza, about 15 minutes north. Tomorrow starts at 8:25 AM."},{"d":2,"kind":"stop","k":"peco","color":"#2FA3A0","ink":"#FFFFFF","boxColor":"#2FA3A0","from":"Santa Fe","leave":"8:25 AM","drive":"~40m","arrive":"9:05 AM","z":"MT","via":"I-25 north to Pecos.","name":"Pecos NHP","type":"National Historical Park","place":"E.E. Fogelson Visitor Center","addr":"Pecos National Historical Park Visitor Center","where":"E.E. Fogelson Visitor Center","hrs":"8:30 AM – 4 PM early April to early November; 9 AM – 4 PM in winter. Closed Thanksgiving, Christmas and New Year’s Day.","ok":"Museum and film. The 1.25-mile Ancestral Sites Trail to the mission church is optional.","about":"Pecos Pueblo sat on the trade route between the Pueblo villages and the Plains tribes. The ruins of its Spanish mission church still stand above the valley."},{"d":2,"kind":"point","k":"mori","from":"Pecos","drive":"~1h 5m","arrive":"11:05 AM","z":"MT","via":"Leave about 10:00. I-25 south → NM-41 south.","name":"Lunch in Moriarty","place":"Route 66 town, right on the way","addr":"Moriarty, NM","note":"Leave by 11:50 for Quarai."},{"d":2,"kind":"stop","k":"quar","unit":"Salinas Pueblo Missions NM","color":"#2FA3A0","ink":"#FFFFFF","boxColor":"#2FA3A0","from":"Moriarty","drive":"~50m","arrive":"12:40 PM","z":"MT","via":"Leave about 11:50. NM-41 south through Estancia → NM-542.","name":"Salinas Pueblo Missions NM","type":"National Monument","place":"Quarai unit","addr":"Quarai, Salinas Pueblo Missions National Monument","where":"Quarai contact station","hrs":"10 AM – 5 PM Apr–Oct; 9 AM – 4 PM Nov–Mar. Closed Thanksgiving, Christmas and New Year’s Day.","ok":"Red sandstone mission church on a short half-mile loop. Two more Salinas cancellations follow at Mountainair and Abó.","about":"Three Spanish mission churches built in the 1600s beside Pueblo villages. Drought, famine and raids emptied all three in the 1670s."},{"d":2,"kind":"point","k":"mtnr","from":"Quarai","drive":"~12m","arrive":"1:30 PM","z":"MT","via":"Leave about 1:15. NM-55 south.","name":"Mountainair Headquarters","place":"Salinas Pueblo Missions NM","addr":"105 S Ripley Ave, Mountainair, NM 87036","bonus":{"title":"Extra Salinas cancellation · Mountainair HQ","where":"Main visitor center, 105 S Ripley Ave. Ask whether they also hold the Gran Quivira stamp.","hrs":"10 AM – 5 PM Apr–Oct; 9 AM – 4 PM Nov–Mar."},"note":"Optional: Gran Quivira is 25 miles south and back, adding about 1.5 hours round trip."},{"d":2,"kind":"point","k":"abo","from":"Mountainair","drive":"~15m","arrive":"2:10 PM","z":"MT","via":"Leave about 1:55. US-60 west.","name":"Abó","place":"Salinas Pueblo Missions NM","addr":"Abo, Salinas Pueblo Missions National Monument","bonus":{"title":"Extra Salinas cancellation · Abó","where":"Abó contact station","hrs":"10 AM – 5 PM Apr–Oct; 9 AM – 4 PM Nov–Mar."},"note":"The last of the three Salinas sites. Leave about 2:40 for Albuquerque."},{"d":2,"kind":"night","k":"abqh2","from":"Abó","drive":"~1h 15m","arrive":"3:55 PM","z":"MT","via":"Leave about 2:40. US-60 west → NM-47 north → I-25 north.","name":"Albuquerque, NM","addr":"Best Western Airport Albuquerque InnSuites, 2400 Yale Blvd SE, Albuquerque, NM","note":"Best Western Airport InnSuites, 2400 Yale Blvd SE. Dinner in Old Town Albuquerque. Tomorrow starts at 7:00 AM; check out with your luggage."},{"d":3,"kind":"stop","k":"elmo","color":"#D9A441","ink":"#2A1820","boxColor":"#B5832A","from":"Albuquerque","leave":"7:00 AM","drive":"~2h 5m","arrive":"9:05 AM","z":"MT","via":"I-40 west → exit 81 → NM-53. Gas up in Grants on the way; stations are sparse west of it.","name":"El Morro NM","type":"National Monument","place":"El Morro Visitor Center, Ramah","addr":"El Morro National Monument Visitor Center","where":"Visitor center","hrs":"9 AM – 5 PM. Daily late May to mid-October; Thursday–Monday the rest of the year (closed Tuesday and Wednesday). Closed Thanksgiving, Christmas and New Year’s Day.","ok":"The half-mile Inscription Loop passes the pool and centuries of carved signatures. Arrive by 4 PM to walk it (2:30 PM for the longer Headland Trail). Trail status (505) 783-4226 x801.","about":"A sandstone bluff with a hidden pool, where Ancestral Puebloans, Spanish travelers and U.S. Army surveyors all carved their marks over the centuries."},{"d":3,"kind":"stop","k":"elma","color":"#D9A441","ink":"#2A1820","boxColor":"#B5832A","from":"El Morro","drive":"~50m","arrive":"11:05 AM","z":"MT","via":"Leave about 10:15. NM-53 back to I-40 exit 85.","name":"El Malpais NM","type":"National Monument","place":"Visitor Center, Grants","addr":"El Malpais National Monument Visitor Center, 1900 E Santa Fe Ave, Grants, NM","where":"Visitor center, 1900 E Santa Fe Ave (I-40 exit 85)","hrs":"Daily 9 AM – 5 PM. Closed Thanksgiving, Christmas and New Year’s Day.","ok":"Lunch in Grants, 11:30 – 12:15.","about":"“Malpais” means badlands: rugged lava flows, lava tubes and cinder cones from a volcanic field that last erupted a few thousand years ago."},{"d":3,"kind":"stop","k":"petr","color":"#D9A441","ink":"#2A1820","boxColor":"#B5832A","from":"Grants","drive":"~1h 10m","arrive":"1:25 PM","z":"MT","via":"Leave about 12:15. I-40 east → Unser Blvd.","name":"Petroglyph NM","type":"National Monument","place":"Information Center","addr":"Petroglyph National Monument Visitor Center, 6510 Western Trail NW, Albuquerque","where":"Information Center, 6510 Western Trail NW","hrs":"8:30 AM – 4:30 PM. Closed Thanksgiving, Christmas and New Year’s Day.","ok":"No petroglyphs here; it’s the stamp and map stop. Boca Negra is next.","about":"Thousands of images pecked into the dark volcanic boulders of Albuquerque’s West Mesa, most by Ancestral Pueblo people several hundred years ago."},{"d":3,"kind":"point","k":"boca","from":"the Information Center","drive":"~7m","arrive":"2:10 PM","z":"MT","via":"Leave about 2:00. Unser Blvd north → Atrisco Dr.","name":"Boca Negra Canyon","place":"Petroglyph NM","addr":"Boca Negra Canyon, Albuquerque","note":"About 100 petroglyphs close to the parking areas. The Macaw Trail is a 5-minute walk.","acc":"Paths are partly paved but not wheelchair accessible.","warn":"Open 8:30 AM – 4:30 PM; last entry 4 PM."},{"d":3,"kind":"point","k":"oldt","from":"Boca Negra","drive":"~20m","arrive":"3:20 PM","z":"MT","via":"Leave about 3:00.","name":"Old Town Albuquerque","place":"Early dinner","addr":"Old Town Plaza, Albuquerque, NM","note":"San Felipe de Neri church and the plaza. Leave about 5:15 to return the car."},{"d":3,"kind":"home","k":"abq","from":"Old Town","drive":"~15m","arrive":"5:30 PM","z":"MT","title":"Albuquerque → home","note":"Return the car at the Sunport Rental Car Center and shuttle to the terminal; aim to be at security by 6:15. ABQ ~7:50 PM → OAK, often via SAN (sample timing). Home around 11:30 PM Pacific.","navTo":"Albuquerque Rental Car Center","navLabel":"Navigate to car return ↗"}],"library":"index.html"};
const ROUTE = TRIP.route, DAYS = TRIP.days, STOPS = TRIP.stops;
const LASTDAY = DAYS.length - 1;
let n = 0; const NUMOF = {};
STOPS.forEach(s => { if (s.kind === 'stop') { s.num = s.stampId ? NUMOF[s.stampId] : ++n; NUMOF[s.k] = s.num; } });
const stopColor = s => s.color || DAYS[s.d].color;
const dayColor = d => DAYS[d].color;
const DL = d => DAYS[d].label || ('Day ' + d);
const DK = d => DAYS[d].kicker || (DL(d) + ' · ' + DAYS[d].dowLong + (DAYS[d].date ? ', ' + DAYS[d].date : ''));

/* ---------- stamp storage ---------- */
const SKEY = TRIP.slug + '-book-stamps', PKEY = TRIP.slug + '-book-page';
const UNITS = [];
STOPS.filter(s => s.kind === 'stop' && !s.stampId).forEach(s => {
  UNITS.push({ id: s.k, name: s.unit || s.name, d: s.d, place: s.place, label: s.num, color: s.boxColor || stopColor(s) });
  (s.also || []).forEach(u => UNITS.push({ id: u.id, name: u.name, d: s.d, place: s.place, label: s.num + '+', color: u.color || stopColor(s) }));
});
const UNIT = Object.fromEntries(UNITS.map(u => [u.id, u]));
const NSTAMPS = UNITS.length;
let got = {};
try { got = JSON.parse(localStorage.getItem(SKEY) || '{}') || {}; } catch (e) { got = {}; }
// stamps already collected (past trips): checked unless unticked on this device
(TRIP.collected || []).forEach(id => { if (!(id in got)) got[id] = true; });
function saveGot() { try { localStorage.setItem(SKEY, JSON.stringify(got)); } catch (e) {} }

/* ---------- maps ---------- */
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const a in attrs) e.setAttribute(a, attrs[a]); if (parent) parent.appendChild(e); return e; }
function routeD(keys) { return keys.map((k, i) => (i ? 'L' : 'M') + PT[k][0] + ' ' + PT[k][1]).join(''); }

function buildMap(svg, o) {
  // o: { focus:[keys], aspect, dayFocus, leg:[a,b], now:key }
  const pad = o.pad || 60;
  let xs = o.focus.map(k => PT[k][0]), ys = o.focus.map(k => PT[k][1]);
  let x0 = Math.min(...xs) - pad, x1 = Math.max(...xs) + pad, y0 = Math.min(...ys) - pad, y1 = Math.max(...ys) + pad;
  let w = Math.max(x1 - x0, o.minW || 220), h = Math.max(y1 - y0, (o.minW || 220) / o.aspect);
  if (w / h > o.aspect) h = w / o.aspect; else w = h * o.aspect;
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  const vb = [cx - w / 2, cy - h / 2, w, h];
  svg.setAttribute('viewBox', vb.map(v => v.toFixed(1)).join(' '));
  svg.setAttribute('preserveAspectRatio', 'xMidYMid slice');
  const s = w / 1000;
  const base = document.getElementById('basemap').cloneNode(true); base.removeAttribute('id');
  base.querySelectorAll('.sl').forEach(t => t.setAttribute('font-size', (s * 22).toFixed(1)));
  base.querySelectorAll('.cl').forEach(t => t.setAttribute('font-size', (s * 17).toFixed(1)));
  base.querySelectorAll('.cd').forEach(c => c.setAttribute('r', (s * 3.5).toFixed(1)));
  base.querySelectorAll('.cl').forEach(t => t.setAttribute('dy', (-s * 9).toFixed(1)));
  svg.appendChild(base);
  // whole route, faint
  el('path', { d: routeD(ROUTE), class: 'rt', stroke: '#D9BFB4', 'stroke-width': 2 }, svg);
  // day segments
  for (let d = 1; d <= LASTDAY; d++) {
    if (!DAYS[d].start) continue;
    const a = ROUTE.indexOf(DAYS[d].start), b = ROUTE.indexOf(DAYS[d].end);
    const dim = o.dayFocus && o.dayFocus !== d;
    el('path', { d: routeD(ROUTE.slice(a, b + 1)), class: 'rt', stroke: DAYS[d].color, 'stroke-width': dim ? 2.5 : 4, opacity: dim ? .35 : .9 }, svg);
  }
  if (o.leg) el('path', { d: routeD(o.leg), class: 'leg' }, svg);
  // airports
  TRIP.airports.forEach(([k, lab]) => {
    const g = el('g', { class: 'end' }, svg), r = s * 17;
    const wr = r * (0.9 + 0.62 * lab.length);
    el('rect', { x: PT[k][0] - wr / 2, y: PT[k][1] - r * .8, width: wr, height: r * 1.6, rx: r * .4 }, g);
    const t = el('text', { x: PT[k][0], y: PT[k][1], 'font-size': (r * .9).toFixed(1) }, g); t.textContent = lab;
  });
  // overnight dots
  STOPS.filter(x => x.kind === 'night').map(x => x.k).forEach(k => {
    const c = el('circle', { cx: PT[k][0], cy: PT[k][1], r: s * 7, fill: '#33202A', stroke: '#FFFFFF', 'stroke-width': 1.5, 'vector-effect': 'non-scaling-stroke' }, svg);
  });
  // points of interest (no stamp)
  STOPS.filter(x => x.kind === 'point').forEach(x => {
    const now = x.k === o.now;
    el('circle', { cx: PT[x.k][0], cy: PT[x.k][1], r: s * (now ? 11 : 6), fill: now ? DAYS[x.d].color : '#FFFFFF', stroke: '#33202A', 'stroke-width': now ? 3 : 1.5, 'vector-effect': 'non-scaling-stroke', opacity: o.dayFocus && o.dayFocus !== x.d ? .4 : 1 }, svg);
  });
  // pins (draw current last)
  const r = s * (o.pinR || 16);
  const list = STOPS.filter(x => x.kind === 'stop' && (!x.stampId || x.k === o.now));
  list.sort((a, b) => (a.k === o.now) - (b.k === o.now));
  list.forEach(st => {
    const dim = o.dayFocus && o.dayFocus !== st.d;
    const g = el('g', { class: 'pin' + (st.k === o.now ? ' now' : '') + (dim ? ' dim' : '') }, svg);
    const rr = st.k === o.now ? r * 1.35 : r;
    el('circle', { cx: PT[st.k][0], cy: PT[st.k][1], r: rr, fill: stopColor(st) }, g);
    const t = el('text', { x: PT[st.k][0], y: PT[st.k][1], 'font-size': (rr * 1.05).toFixed(1) }, g); t.textContent = st.num;
    if (st.ink) t.style.fill = st.ink;
  });
}

/* ---------- pages ---------- */
const pages = []; // {el, label, group}
const book = document.getElementById('book');
function addPage(cls, html, label, group, after) {
  const p = document.createElement('section');
  p.className = 'page ' + cls;
  p.innerHTML = '<div class="scroll">' + html + '</div><div class="shade"></div>';
  book.appendChild(p);
  pages.push({ el: p, label, group });
  if (after) after(p);
  return pages.length - 1;
}
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const nav = a => 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(a);
const firstPageOfDay = {};
const pageOfStop = {};

// Cover
addPage('cover', `
  ${TRIP.placeholder ? `<div class="ph">${esc(TRIP.placeholder)}</div>` : ''}
  <div class="kicker" style="color:#2FA3A0">Trip book</div>
  <h1 class="serif">${esc(TRIP.title)}</h1>
  <div class="sub">${esc(TRIP.subtitle)}</div>
  <svg class="map" id="coverMap" style="aspect-ratio:1/1.05"></svg>
  <div style="margin-top:10px">
    ${TRIP.chips.map((c, i) => `<span class="chip${i ? '' : ' hot'}">${esc(c)}</span>`).join('')}
  </div>
  <div class="legend" id="legend"></div>
  <div class="tally"><div><div style="font-size:12px;color:#E9B872;font-weight:700;letter-spacing:.08em;text-transform:uppercase">Stamps this trip</div><div class="n"><span class="gotN">0</span> / ${NSTAMPS}</div></div><div style="font-size:30px">◈</div></div>
  <div class="swipe">Swipe or tap Next to turn the page ›</div>
  ${TRIP.itinerary ? `<a class="backlink" href="${TRIP.itinerary}">← Full itinerary page</a>` : ''}
  ${TRIP.library ? `<a class="backlink" href="${TRIP.library}">📚 All trip books</a>` : ''}
`, 'Cover · trip map', 'Start', p => {
  buildMap(p.querySelector('#coverMap'), { focus: ROUTE, aspect: 1 / 1.05, pad: 34, pinR: 15 });
});

// Day 0
const D0 = DAYS[0];
addPage('', `
  <div class="dayband" style="background:${D0.color}">
    <div class="kicker">${DK(0)}</div>
    <h2 class="serif">${esc(D0.title)}</h2>
    <div class="meta">${esc(D0.meta || '')}</div>
  </div>
  ${D0.html || ''}
`, DL(0) + ' · ' + D0.title, 0);

// Days
for (let d = 1; d <= LASTDAY; d++) {
  const D = DAYS[d];
  if (D.kind === 'cruise') {
    firstPageOfDay[d] = addPage('', `
      <div class="dayband" style="background:${D.color}">
        <div class="kicker">${DK(d)}</div>
        <h2 class="serif">${esc(D.title)}</h2>
        ${D.sub ? `<div class="meta">${esc(D.sub)}</div>` : ''}
      </div>
      ${D.html || ''}
    `, DL(d) + ' · ' + D.title, d);
    continue;
  }
  const items = STOPS.filter(s => s.d === d);
  const first = items[0];
  const metaBits = [D.stamps ? D.stamps + ' stamp' + (D.stamps > 1 ? 's' : '') : '', D.drive ? '🚗 ' + D.drive + ' driving' : '', D.tzline || ''].filter(Boolean).join(' · ');
  firstPageOfDay[d] = addPage('', `
    <div class="dayband" style="background:${D.color}">
      <div class="kicker">${DK(d)}</div>
      <h2 class="serif">${D.title}</h2>
      <div class="meta">${D.sub || ''}${metaBits ? '<br>' + metaBits : ''}</div>
    </div>
    <svg class="map" id="dm${d}" style="aspect-ratio:1.45/1"></svg>
    <ul class="tl">
      <li data-jump="first"><div class="tm">${first.leave}<br>${first.z}</div><div class="nm">Leave ${esc(first.from)}</div></li>
      ${items.map(s => `<li data-stop="${s.k}"><div class="tm">${s.arrive}<br>${s.z}</div><div class="nm">${s.kind === 'stop' ? `<span class="num" style="background:${stopColor(s)}${s.ink ? ';color:' + s.ink : ''}">${s.num}</span>` : (s.kind === 'night' ? '☾ ' : s.kind === 'point' ? '• ' : '✈︎ ')}${esc(s.kind === 'night' ? 'Sleep in ' + s.name : (s.title || s.name))}<small>🚗 ${s.drive} from ${esc(s.from)}</small></div></li>`).join('')}
    </ul>
    ${D.cut ? `<div class="cut"><b>${esc(D.cutLabel || 'Hard cutoffs')}:</b> ${D.cut}</div>` : ''}
    ${D.gmaps ? `<a class="gmaps" href="${D.gmaps}" target="_blank" rel="noopener">Open ${DL(d)} route in Google Maps ↗</a>` : ''}
  `, DL(d) + ' · ' + D.title, d, p => {
    buildMap(p.querySelector('#dm' + d), { focus: ROUTE.slice(ROUTE.indexOf(D.start), ROUTE.indexOf(D.end) + 1), aspect: 1.45, pad: 45, dayFocus: d });
  });

  items.forEach((s, i) => {
    const fromKey = i === 0 ? D.start : items[i - 1].k;
    const driveCard = `
      <div class="drive">
        <div class="car">🚗</div>
        <div><div class="fr">${s.leave ? 'Leave ' + esc(s.from) + ' ' + s.leave : 'From ' + esc(s.from)}</div><div class="dt">${s.drive}</div>${s.tz ? `<div class="tz">${s.tz}</div>` : ''}</div>
        <div class="arr"><div class="lab">${s.arriveLabel || 'Arrive'}</div><div class="t">${s.arrive}</div><div class="z">${s.z}</div></div>
      </div>
      ${s.via ? `<div class="note" style="background:#F7EEE4">${esc(s.via)}</div>` : ''}`;
    const mapSvg = `<svg class="map" style="aspect-ratio:1.7/1" data-map="${fromKey},${s.k}"></svg>`;
    let html, label;
    if (s.kind === 'stop') {
      const C = stopColor(s);
      const units = [{ id: s.stampId || s.k, name: s.unit, where: s.where, hrs: s.hrs, color: s.boxColor || C }].concat((s.also || []).map(u => Object.assign({ color: u.color || C }, u)));
      const dayStops = items.filter(x => x.kind === 'stop');
      html = `
        <div class="kicker" style="color:${D.color}">${DL(d)} · Stop ${dayStops.indexOf(s) + 1} of ${dayStops.length}</div>
        <div style="height:8px"></div>
        ${driveCard}
        ${mapSvg}
        <div class="stopname"><div class="num" style="background:${C}${s.ink ? ';color:' + s.ink : ''}">${s.num}</div><h2 class="serif">${esc(s.name)}</h2>
          <div class="place">${esc(s.type)} · ${esc(s.place)}</div></div>
        ${s.optional ? `<div class="note ok">${esc(s.optional)}</div>` : ''}
        ${units.map(u => `
        <div class="stampbox" style="border-color:${u.color}">
          <div class="kicker" style="color:${u.color}">◈ ${units.length > 1 ? esc(u.name) : 'Stamp'}</div>
          <div class="where">${esc(u.where)}</div>
          ${u.hrs ? `<div class="hrs">${esc(u.hrs)}</div>` : ''}
          <button class="got" data-got="${u.id}"></button>
        </div>`).join('')}
        ${s.warn ? `<div class="note warn">⚠ ${esc(s.warn)}</div>` : ''}
        ${s.acc ? `<div class="note acc">♿ ${esc(s.acc)}</div>` : ''}
        ${s.ok ? `<div class="note ok">✓ ${esc(s.ok)}</div>` : ''}
        ${s.html || ''}
        <div class="actions"><a href="${nav(s.addr)}" target="_blank" rel="noopener">Navigate ↗</a><a class="alt" href="#" data-jumpday="${d}">${DL(d)} overview</a></div>
        ${s.about ? `<div class="about"><div class="kicker">About this place</div>${esc(s.about)}</div>` : ''}
        <div class="foot">Re-check hours in the NPS app the week before.</div>`;
      label = s.num + ' · ' + s.name;
    } else if (s.kind === 'point') {
      html = `
        <div class="kicker" style="color:${D.color}">${DL(d)} · Along the way</div>
        <div style="height:8px"></div>
        ${driveCard}
        ${mapSvg}
        <div class="stopname"><h2 class="serif">${esc(s.name)}</h2>${s.place ? `<div class="place">${esc(s.place)}</div>` : ''}</div>
        ${s.bonus ? `<div class="stampbox" style="border-color:#B08C8F"><div class="kicker" style="color:#7A5A62">◈ ${esc(s.bonus.title || 'Bonus cancellation · optional')}</div><div class="where">${esc(s.bonus.where)}</div>${s.bonus.hrs ? `<div class="hrs">${esc(s.bonus.hrs)}</div>` : ''}</div>` : ''}
        ${s.note ? `<p>${esc(s.note)}</p>` : ''}
        ${s.warn ? `<div class="note warn">⚠ ${esc(s.warn)}</div>` : ''}
        ${s.acc ? `<div class="note acc">♿ ${esc(s.acc)}</div>` : ''}
        ${s.ok ? `<div class="note ok">✓ ${esc(s.ok)}</div>` : ''}
        ${s.html || ''}
        <div class="actions"><a href="${nav(s.addr || s.name)}" target="_blank" rel="noopener">Navigate ↗</a><a class="alt" href="#" data-jumpday="${d}">${DL(d)} overview</a></div>`;
      label = '• ' + s.name;
    } else if (s.kind === 'night') {
      const next = DAYS[d + 1];
      const nextLine = next.kind === 'cruise' ? esc(next.sub || '') : `${next.stamps ? next.stamps + (next.stamps === 1 ? ' stamp · ' : ' stamps · ') : ''}${next.drive ? '🚗 ' + next.drive + '. ' : ''}${next.cut || ''}`;
      html = `
        <div class="kicker" style="color:${D.color}">${DL(d)} · End of the day</div>
        <div style="height:8px"></div>
        ${driveCard}
        ${mapSvg}
        <div class="moon">☾</div>
        <h2 class="serif">Sleep in ${esc(s.name)}</h2>
        <p>${esc(s.note)}</p>
        ${s.html || ''}
        <div class="actions"><a href="${nav(s.addr || s.name)}" target="_blank" rel="noopener">Navigate ↗</a></div>
        <div class="cut" style="background:#F7EEE4;border-left-color:${next.color}"><b>Tomorrow · ${DL(d + 1)}: ${esc(next.title)}</b><br>${nextLine}</div>`;
      label = '☾ Sleep in ' + s.name;
    } else {
      html = `
        <div class="kicker" style="color:${D.color}">${DL(d)} · Last leg</div>
        <div style="height:8px"></div>
        ${driveCard}
        ${mapSvg}
        <div class="moon">✈︎</div>
        <h2 class="serif">${esc(s.title)}</h2>
        <p>${esc(s.note)}</p>
        ${s.html || ''}
        <div class="actions"><a href="${nav(s.navTo)}" target="_blank" rel="noopener">${esc(s.navLabel || 'Navigate ↗')}</a></div>
        <div class="tally" style="background:#33202A;color:#F6E9DA;margin-top:16px"><div><div style="font-size:12px;color:#E9B872;font-weight:700;letter-spacing:.08em;text-transform:uppercase">Stamps collected</div><div class="n"><span class="gotN">0</span> / ${NSTAMPS}</div></div><div style="font-size:30px">◈</div></div>
        <ul class="chk" id="chk"></ul>`;
      label = '✈︎ ' + s.title;
    }
    pageOfStop[s.k] = addPage('', html, label, d, p => {
      const m = p.querySelector('[data-map]');
      const [a, b] = m.dataset.map.split(',');
      buildMap(m, { focus: [a, b], leg: [a, b], now: s.k, aspect: 1.7, pad: 80, minW: TRIP.legMinW || 400, dayFocus: d, pinR: 22 });
    });
  });
}

/* ---------- legend, checklist, stamps ---------- */
document.getElementById('legend').innerHTML = DAYS.slice(1).map((D, i) =>
  `<button data-jumpday="${i + 1}"><span class="sw" style="background:${D.color}"></span><span><b>${DL(i + 1)}${D.dow ? ' · ' + D.dow : ''}</b><span class="s">${esc(D.title)}${D.stamps ? ' · ' + D.stamps + (D.stamps > 1 ? ' stamps' : ' stamp') : ''}</span></span></button>`).join('');
document.getElementById('chk').innerHTML = UNITS.map(u =>
  `<li data-got="${u.id}"><span class="bx"></span><span>${u.label}. ${esc(u.name)}<small>${DL(u.d)} · ${esc(u.place)}</small></span></li>`).join('');

function renderGot() {
  const c = UNITS.filter(u => got[u.id]).length;
  document.querySelectorAll('.gotN').forEach(e => e.textContent = c);
  document.querySelectorAll('button.got').forEach(b => {
    const on = !!got[b.dataset.got], col = UNIT[b.dataset.got].color;
    b.classList.toggle('on', on); b.style.background = on ? col : '#F1E3D3';
    b.textContent = on ? '✓ Stamp collected' : 'Tap when you’ve got the stamp';
  });
  document.querySelectorAll('.chk li').forEach(li => {
    const on = !!got[li.dataset.got], bx = li.querySelector('.bx'), col = UNIT[li.dataset.got].color;
    bx.textContent = on ? '✓' : ''; bx.style.background = on ? col : 'transparent'; bx.style.borderColor = on ? col : '#E2CFC6';
  });
}

/* ---------- flipping ---------- */
let idx = 0, busy = false;
const pg = document.getElementById('pgnum'), bar = document.getElementById('bar'), prevB = document.getElementById('prev'), nextB = document.getElementById('next');
function chrome() {
  pg.textContent = (idx + 1) + ' / ' + pages.length;
  bar.style.width = ((idx) / (pages.length - 1) * 100) + '%';
  prevB.disabled = idx === 0; nextB.disabled = idx === pages.length - 1;
  try { localStorage.setItem(PKEY, idx); } catch (e) {}
  try { history.replaceState(null, '', '#p' + (idx + 1)); } catch (e) {}
}
function show(i) { pages.forEach((p, j) => p.el.className = p.el.className.replace(/\b(show|under|flip-out|flip-in)\b/g, '').trim() + (j === i ? ' show' : '')); idx = i; chrome(); }
function go(i) {
  if (busy || i === idx || i < 0 || i >= pages.length) return;
  const cur = pages[idx].el, nxt = pages[i].el;
  nxt.querySelector('.scroll').scrollTop = 0;
  busy = true;
  const done = () => { pages.forEach((p, j) => { if (j !== i) p.el.classList.remove('show'); p.el.classList.remove('under', 'flip-out', 'flip-in'); }); idx = i; busy = false; chrome(); };
  if (i > idx) {
    nxt.classList.add('show', 'under'); cur.classList.add('flip-out');
    cur.addEventListener('animationend', done, { once: true });
  } else {
    cur.classList.add('under'); nxt.classList.add('show', 'flip-in');
    nxt.addEventListener('animationend', done, { once: true });
  }
  setTimeout(() => { if (busy) done(); }, 900);
}
prevB.onclick = () => go(idx - 1);
nextB.onclick = () => go(idx + 1);
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(idx + 1); if (e.key === 'ArrowLeft') go(idx - 1); });
let tx = 0, ty = 0;
book.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
book.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) go(idx + (dx < 0 ? 1 : -1));
}, { passive: true });

document.addEventListener('click', e => {
  const g = e.target.closest('[data-got]');
  if (g) { got[g.dataset.got] = !got[g.dataset.got]; saveGot(); renderGot(); return; }
  const jd = e.target.closest('[data-jumpday]');
  if (jd) { e.preventDefault(); go(firstPageOfDay[jd.dataset.jumpday]); return; }
  const js = e.target.closest('[data-stop]');
  if (js) { go(pageOfStop[js.dataset.stop]); return; }
  const jf = e.target.closest('[data-jump]');
  if (jf) { go(idx + 1); return; }
});

/* ---------- contents ---------- */
const toc = document.getElementById('toc'), tocPanel = document.getElementById('tocPanel');
function openToc() {
  let h = '<div class="kicker" style="color:#2FA3A0">Pages</div>', grp = '';
  pages.forEach((p, i) => {
    if (p.group !== grp) { grp = p.group; const isDay = typeof grp === 'number'; h += `<h3 style="color:${isDay ? DAYS[grp].color : '#7A5A62'}">${isDay ? DL(grp) + (DAYS[grp].dow ? ' · ' + DAYS[grp].dow : '') : grp}</h3>`; }
    h += `<a href="#" data-p="${i}" class="${i === idx ? 'cur' : ''}">${esc(p.label)}<span>${i + 1}</span></a>`;
  });
  tocPanel.innerHTML = h; toc.classList.add('open');
}
document.getElementById('tocBtn').onclick = openToc;
toc.addEventListener('click', e => {
  const a = e.target.closest('[data-p]');
  if (a) { e.preventDefault(); toc.classList.remove('open'); go(+a.dataset.p); return; }
  if (e.target === toc) toc.classList.remove('open');
});

/* ---------- start ---------- */
renderGot();
let start = 0;
const hm = /#p(\d+)/.exec(location.hash);
if (hm) start = Math.min(pages.length - 1, Math.max(0, +hm[1] - 1));
else { try { const s = +localStorage.getItem(PKEY); if (s > 0 && s < pages.length) start = s; } catch (e) {} }
show(start);
</script>
</body>
</html>
